<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rukayat's Profile</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#ffb6c1,#ffe4ec);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:350px;
            background:#fff;
            border-radius:20px;
            padding:25px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .profile-pic{
            width:120px;
            height:120px;
            border-radius:50%;
            background:#ff69b4;
            color:white;
            font-size:50px;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
        }

        h1{
            color:#d63384;
        }

        p{
            font-size:18px;
            color:#444;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            background:#ffe6f0;
            margin:8px;
            padding:10px;
            border-radius:10px;
            font-weight:bold;
        }

        footer{
            margin-top:20px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="profile-pic">R</div>

    <h1>Rukayat</h1>

    <p><strong>Age:</strong> 16</p>

    <p><strong>Birthday:</strong> February</p>

    <h2>Best Friends ❤️</h2>

    <ul>
        <li>Mojeed</li>
        <li>Bill</li>
        <li>James</li>
    </ul>

    <footer>
        Made with ❤️ using HTML & CSS
    </footer>

</div>

</body>
</html>
